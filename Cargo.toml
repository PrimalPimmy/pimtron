[package]
name = "pimtron"
version = "0.1.0"
edition = "2024"

[dependencies]
console_error_panic_hook = "0.1.7"
leptos = { version = "0.8.14", features = ["csr"] }
leptos_meta = "0.8.5"
leptos_router = "0.8.10"
serde = { version = "1.0.228", features = ["derive"] }
stylance = "0.7.4"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "Node", "HtmlCanvasElement", "WebGlRenderingContext", "Navigator", "Gpu", "HtmlElement", "HtmlDivElement", "CssStyleDeclaration", "Performance"] }
wasm-bindgen = "0.2"
js-sys = "0.3.83"
wasm-bindgen-futures = "0.4.56"
gloo-net = "0.6.0"
serde_json = "1.0.148"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gray_matter = "0.3.2"
pulldown-cmark = "0.13.0"
syntect = "5.3.0"

# Optimize dependencies even in dev builds to reduce binary size and memory usage
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"

[[bin]]
name = "pimtron"
path = "src/main.rs"

[[bin]]
name = "gen_posts"
path = "src/bin/gen_posts.rs"

