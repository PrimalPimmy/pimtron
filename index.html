<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link data-trunk rel="css" href="index.css" />
    <link data-trunk rel="rust" data-bin="pimtron" />
    <link data-trunk rel="copy-dir" href="assets" />
    <link data-trunk rel="copy-dir" href="generated_posts" data-target-path="posts" />
    <link data-trunk rel="copy-file" href="_redirects" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pimtron" />
    <meta property="og:description" content="Welcome to Pimtron - My Personal Website and Blog" />
    <meta property="og:image" content="assets/pim.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Pimtron" />
    <meta property="twitter:description" content="All about tech" />
    <meta property="twitter:image" content="assets/pim.png" />

    <title>Pimtron</title>
    <style>
      body { margin: 0; font-family: 'Fira Code', monospace; background-color: #000000; overflow-x: hidden; }
      #loading-layer {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
        gap: 1.5rem;
      }
      .spinner {
        width: 60px;
        height: 60px;
        border: 2px dashed #333;
        border-top: 2px solid #00ff00;
        border-right: 2px solid #00ff00;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
      }
      .loading-text {
        color: #00ff00;
        font-size: 1rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        animation: blink 1.5s infinite;
        text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body ontouchstart="">
    <div id="loading-layer">
      <div class="spinner"></div>
      <div class="loading-text">INITIALIZING SYSTEM...</div>
    </div>
    <script>
      (function() {
        const starCount = 200;
        const background = document.createElement('div');
        background.id = 'star-background';
        background.style.position = 'fixed';
        background.style.top = '0';
        background.style.left = '0';
        background.style.width = '100%';
        background.style.height = '100%';
        background.style.zIndex = '-1';
        background.style.pointerEvents = 'none';
        document.body.appendChild(background);

        const stars = [];
        for (let i = 0; i < starCount; i++) {
          const star = document.createElement('div');
          star.style.position = 'absolute';
          star.style.backgroundColor = '#878787';
          star.style.width = '2px';
          star.style.height = '2px';
          star.style.borderRadius = '50%';
          background.appendChild(star);
          
          stars.push({
            element: star,
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 2
          });
        }

        function updateVisibility() {
          const path = window.location.pathname;
          // Only show stars on the root path
          if (path === '/' || path === '/index.html') {
            background.style.display = 'block';
          } else {
            background.style.display = 'none';
          }
        }

        // Initial check
        updateVisibility();

        // Monkey patch history API to detect SPA navigation
        const originalPushState = history.pushState;
        history.pushState = function() {
          originalPushState.apply(this, arguments);
          updateVisibility();
        };

        const originalReplaceState = history.replaceState;
        history.replaceState = function() {
          originalReplaceState.apply(this, arguments);
          updateVisibility();
        };

        // Handle browser back/forward buttons
        window.addEventListener('popstate', updateVisibility);

        function animate() {
          // Skip animation if not visible
          if (background.style.display === 'none') {
            requestAnimationFrame(animate);
            return;
          }

          const width = window.innerWidth;
          const height = window.innerHeight;

          stars.forEach(star => {
            star.x += star.r * 0.5;
            if (star.x > width) {
              star.x = 0;
              star.y = Math.random() * height;
            }

            star.element.style.transform = `translate(${star.x}px, ${star.y}px) scale(${star.r})`;
            star.element.style.opacity = star.r / 2;
          });

          requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
      })();
    </script>
  </body>
</html>
