<!DOCTYPE html>
<html lang="en">
<script>
  (function () {
    var theme = localStorage.getItem('theme');
    if (theme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link data-trunk rel="css" href="index.css" />
  <link data-trunk rel="rust" data-bin="pimtron" />
  <link data-trunk rel="copy-dir" href="assets" />
  <link data-trunk rel="copy-dir" href="generated_posts" data-target-path="posts" />
  <link data-trunk rel="copy-file" href="_redirects" />
  <link data-trunk rel="copy-file" href="_headers" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Pimtron" />
  <meta property="og:description" content="Welcome to Pimtron" />
  <meta property="og:image" content="https://pimtron.pages.dev/assets/pim.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="Pimtron" />
  <meta property="twitter:description" content="All about tech" />
  <meta property="twitter:image" content="https://pimtron.pages.dev/assets/pim.png" />

  <title>Pimtron</title>
  <style>
    #loading-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
      gap: 1.5rem;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 2px dashed #333;
      border-top: 2px solid #00ff00;
      border-right: 2px solid #00ff00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
    }

    .loading-text {
      color: #00ff00;
      font-size: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      animation: blink 1.5s infinite;
      text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }
  </style>
</head>

<body ontouchstart="">
  <div id="loading-layer">
    <div class="spinner"></div>
    <div class="loading-text">INITIALIZING SYSTEM...</div>
  </div>
</body>

</html>
