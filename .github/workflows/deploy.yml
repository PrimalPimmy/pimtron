name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: DeterminateSystems/flake-checker-action@main

      - name: Perform Pure Nix Build
        # Explicitly building the 'pimtron-site' package defined in flake.nix 
        run: nix build . --out-link site-result

      - name: Prepare Deployment Directory
        run: |
          # Clean the default 'dist' directory just in case
          rm -rf dist
          mkdir -p dist
          # Copy the contents of the Nix store path to 'dist'
          cp -r site-result/* dist/
          echo "Deployment directory created at: $(ls -F dist)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=pimtron
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}